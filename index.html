<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My First Webpage</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            body {
                width: 100%;
                height: 100%;
                font-family: Arial, sans-serif;
                background-color: black;
            }

            .video-container {
                position: relative;
                width: 100%;
                height: 100vh;
                z-index: 0;
            }

            #background-video {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: 0;
            }

            .name {
                position: absolute;
                top: 30%;
                left: 30%;
                color: white;
                font-family: Arial, sans-serif;
                z-index: 1;
            }

            .name h1 {
                font-size: 3vw;
                font-weight: bold;
            }

            .name p {
                font-size: 1.3vw;
                margin-top: 5px;
            }

            .menu {
                position: absolute;
                top: 10%;
                right: 10%;
                color: white;
                text-align: left;
                z-index: 1;
            }

            .menu ul {
                list-style: none;
            }

            .menu ul li {
                font-size: 1.2vw;
                margin-bottom: 10px;
            }

            .menu ul li i {
                margin-right: 8px;
            }
        </style>
    </head>
    <body>
        <div class="video-container">
            <video id="background-video" autoplay muted loop playsinline>
                <source src="background.mp4" type="video/mp4">
            </video>
            <div class="name">
                <h1>Connor Prescott</h1>
                <p>Here's my home page.</p>
            </div>
            <div class="menu">
                <ul>
                    <li><i class="fa-solid fa-user"></i>About Me</li>
                    <li><i class="fa-solid fa-file-lines"></i>Resume</li>
                    <li><i class="fa-solid fa-music"></i>Hobbies</li>
                    <li><a href="project.html" style="color: inherit; text-decoration: none;">
                        <i class="fa-solid fa-laptop-code"></i>Work</a></li>
                </ul>
            </div>
        </div>
    </body>
</html>
